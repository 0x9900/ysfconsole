<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ reflecror_name }} YSF Reflector</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/ysfconsole.css">
</head>
<body>
  <header>
    <h1>Live Reflector — <code>{{ reflector_name }}</code></h1>
    <span id="status" class="off">disconnected</span>
  </header>
  <main>
    <div class="marker">Transmitting:</div>
    <div class="tx">
      <div class="callsign" id="callsign"></div>
      <div class="destination" id="target"></div>
      <div class="gateway" id="gateway"></div>
      <div class="timer" id="timer"></div>
    </div>

    <div id="connected">
      <div class="marker">linked repeaters/gateways:</div>
      <table id="linked">
      </table>
    </div>
    <div id="meta"></div>
  </main>
  <footer>
    © 2027 Fred (W6BSD) <a href="https://tools.bsdworld.org/">https://tools.bsdworld.org/</a>
  </footer>

  <script>
    const connectedEl    = document.getElementById('connected');
    const txEl    = document.getElementById('tx');
    const statusEl = document.getElementById('status');
    const metaEl   = document.getElementById('meta');

    let ws = null;
    let reconnectTimer = null;

    function renderConnected(payload) {

      const cols = [];
      const seen = new Set();
      for (const obj of payload.lines) {
        if (!obj || obj._parse_error) continue;
        for (const k of Object.keys(obj)) {
          if (!seen.has(k)) { seen.add(k); cols.push(k); }
        }
      }

      // --- build the table ---
      const table = document.getElementById('linked');
      table.textContent = "";
      table.className = 'payload-table';

      // thead
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      for (const c of cols) {
        const th = document.createElement('th');
        th.textContent = c.toUpperCase();
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);
      table.appendChild(thead);

      // tbody
      const tbody = document.createElement('tbody');
      for (const obj of payload.lines) {
        const tr = document.createElement('tr');

        if (obj && obj._parse_error) {
          // malformed line — span all columns
          tr.className = 'bad';
          const td = document.createElement('td');
          td.colSpan = Math.max(cols.length, 1);
          td.textContent = '⚠ unparseable: ' + obj._raw;
          tr.appendChild(td);
        } else {
          for (const c of cols) {
            const td = document.createElement('td');
            const v = obj ? obj[c] : undefined;
            td.textContent = (v === undefined || v === null) ? '' : String(v);
            tr.appendChild(td);
          }
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      connectedEl.appendChild(table);

      // --- meta line (unchanged) ---
      metaEl.textContent =
        `${payload.lines.length} Reflector(s) connected — Updated: ${new Date().toLocaleTimeString()}`;
      connectedEl.scrollTop = 0;
    }

    function renderTx(payload) {
      let currentCall = '';
      const call = document.getElementById('callsign');
      const target = document.getElementById('target');
      const gateway = document.getElementById('gateway');

      console.log(payload);

      if (payload.tx === null) {
        callsign.textContent = '';
        target.textContent = '';
        gateway.textContent = '';
        timer.stop();
        timer.reset();
        return;
      }

      tx = payload.tx;
      if (tx.call === currentCall)
        return;

      currentCall = tx.call;
      callsign.textContent = payload.tx.call;
      target.textContent = payload.tx.dest;
      gateway.textContent = payload.tx.gw;
      timer.start();
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/connections`);

      ws.onopen = () => {
        statusEl.textContent = 'connected';
        statusEl.className = 'on';
      };

      ws.onmessage = (ev) => {
        if (!ev.data) return;
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'connected') renderConnected(msg);
        else if (msg.type === 'tx') renderTx(msg);
      };

      ws.onclose = () => {
        statusEl.textContent = 'disconnected';
        statusEl.className = 'off';
        ws = null;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    }

    class Timer {
      constructor(elementId = "timer", maxDurationMs = 3 * 60 * 1000) {
        this.element = document.getElementById(elementId);
        this.intervalId = null;
        this.startTime = 0;
        this.elapsed = 0;
        this.maxDurationMs = maxDurationMs;
      }

      static format(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
        const seconds = String(totalSeconds % 60).padStart(2, "0");
        return `${minutes}:${seconds}`;
      }

      start() {
        if (this.intervalId !== null) return;
        this.startTime = Date.now() - this.elapsed;
        this.render();
        this.intervalId = setInterval(() => this.tick(), 1000);
      }

      tick() {
        this.elapsed = Date.now() - this.startTime;

        if (this.elapsed >= this.maxDurationMs) {
          this.elapsed = this.maxDurationMs;
          this.render();
          this.stop();
          return;
        }
        this.render();
      }

      stop() {
        if (this.intervalId === null) return;
        clearInterval(this.intervalId);
        this.intervalId = null;
        this.render();
      }

      reset() {
        this.stop();
        this.elapsed = 0;
        this.element.textContent = "";
      }

      render() {
        this.element.textContent = Timer.format(this.elapsed);
      }
    }

    let timer = new Timer();
    connect();
  </script>
</body>
</html>
