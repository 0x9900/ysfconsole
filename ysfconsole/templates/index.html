<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ reflector_name }} YSF Reflector {{ reflector_id }}</title>

  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{ reflector_name }} Reflector Dashboard by W6BSD">
  <meta name="author" content="W6BSD">
  <meta name="copyright" content="Fred C. (W6BSD)">
  <meta name="keywords" content="c4fm, reflector, ysf protocol, yaesu, {{ reflector_name }}">

 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wdth@125&family=Orbitron:wght@600&family=Source+Code+Pro:wght@200..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/ysfconsole.css">
</head>
<body>
  <header>
    <h1><span class="hide">Live Reflector:&nbsp; </span><span class="oneword">{{ reflector_name }}</span> — {{ reflector_id }}</h1>
    <span id="status" class="off">disconnected</span>
  </header>
  <main>
    <div class="tx">
      <div class="callsign" id="callsign"></div>
      <div class="timer" id="timer"></div>
    </div>
    <div id="connected">
      <div class="link-head">
        <div class="marker">Linked repeaters/gateways:</div>
        <div id="info"></div>
        <div id="meta"></div>
      </div>
      <table id="linked" class="payload-table"></table>
    </div>

    <div id="activity" hidden>
      <div class="marker">Recent activity:</div>
      <table id="recent" class="payload-table"></table>
    </div>
  </main>

  <footer>
    ysfconsole is <a href="https://github.com/0x9900/ysfconsole" target="github">available on github</a> ({{ version }})
    &copy; 2026 Fred <a href="https://www.qrz.com/db/W6BSD/" target="bsd">W6BSD</a><br>
    Visit <a href="https://bsdworld.org/" target="bsd">bsdworld.org</a> for solar and propagation information.<br>
    HamRadio <a href="https://tools.bsdworld.org/" target="bsd">Tools</a>
    &mdash; Maidenhead Grid Square <a href="https://tools.bsdworld.org/QRA-Locator/" target="bsd">QRA-Locator</a>
  </footer>

  <script>
    'use strict';

    const RECONNECT_MS = {{ reconnect_ms }};
    const MAX_ACTIVITY = {{ max_activity }};
    const SERVER_ACTIVITY = {{ last_traffic|tojson }};

    let connected = [];
    let activity = [];

    const $ = (id) => document.getElementById(id);
    const callsignEl  = $('callsign');

    class Timer {
      constructor(elementId = 'timer', maxDurationMs = 1 * 60 * 1000) {
        this.element = $(elementId);
        this.intervalId = null;
        this.startTime = 0;
        this.elapsed = 0;
        this.maxDurationMs = maxDurationMs;
      }

      static format(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${minutes}:${seconds}`;
      }

      start() {
        if (this.intervalId !== null) return;
        this.startTime = Date.now() - this.elapsed;
        this.render();
        this.intervalId = setInterval(() => this.tick(), 1000);
      }

      tick() {
        this.elapsed = Date.now() - this.startTime;
        this.render();
        if (this.elapsed >= this.maxDurationMs) {
          this.element.classList.add('overtime');
        }
      }

      stop() {
        if (this.intervalId === null) return;
        clearInterval(this.intervalId);
        this.intervalId = null;
        this.render();
      }

      reset() {
        this.stop();
        this.elapsed = 0;
        this.element.textContent = '';
        this.element.classList.remove('overtime');

      }

      render() {
        this.element.textContent = Timer.format(this.elapsed);
      }
    }

    function showInfo(msg) {
      const infoElement = $('info');
      infoElement.textContent = msg;
      infoElement.classList.remove('faded');
      clearTimeout(infoElement._hideTimer);
      infoElement._hideTimer = setTimeout(() => {
        infoElement.classList.add('faded');
      }, 10000);
    }

    const timer = new Timer();
    let currentCall = '';
    let ws = null;
    let reconnectTimer = null;

    function makeRow(entry, cols, linkColumn) {
      const tr = document.createElement('tr');

      for (const col of cols) {
        const td = document.createElement('td');
        const value = entry[col] ?? '';

        if (col.toLowerCase() === 'time' && value) {
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) {
            // Don't render "Invalid Date" — fall back to the raw value
            td.textContent = value;
          } else {
            const full = document.createElement('span');
            full.className = 'full-date';
            full.textContent = date.toLocaleString();

            const time = document.createElement('span');
            time.className = 'time-only';
            time.textContent = date.toLocaleTimeString('en-US', { hour12: false });

            td.append(full, time);
          }
        } else if (col === linkColumn && value) {
          const a = document.createElement('a');
          // encodeURIComponent so values with slashes, spaces, etc. don't break the URL
          a.href = `https://qrz.com/db/${encodeURIComponent(value)}`;
          a.textContent = value;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          td.appendChild(a);
        } else {
          td.textContent = value;
        }

        tr.appendChild(td);
      }

      return tr;
    }

    function renderConnectedTable() {
      // Columns = union of keys, in order of first appearance.
      const cols = [...new Set(connected.flatMap(Object.keys))];

      const headRow = document.createElement('tr');
      for (const c of cols) {
        const th = document.createElement('th');
        th.textContent = c.toUpperCase();
        headRow.appendChild(th);
      }
      const thead = document.createElement('thead');
      thead.appendChild(headRow);

      const tbody = document.createElement('tbody');
      for (const obj of connected) {
        tbody.appendChild(makeRow(obj, cols, 'call'));
      }

      $('linked').replaceChildren(thead, tbody);

    }

    const sameEntry = (a, b) => a.call === b.call && a.ip_address === b.ip_address && a.port === b.port;

    function addConnected({ data }) {
      if (!connected.some(item => sameEntry(item, data))) {
        connected.push(data);
      }
      renderConnectedTable();
      showInfo(`${data.call} Connected`);
    }

    function removeConnected({ data }) {
      const reason = (data.reason || 'Disconnected').replace(/^./, c => c.toUpperCase());
      connected = connected.filter(item => !sameEntry(item, data));
      renderConnectedTable();
      showInfo(`${data.call} ${reason}`);
    }

    function renderConnected({ data }) {
      const lines = data.filter(Boolean);
      connected = [...lines];
      renderConnectedTable();
    }

    function renderActivityTable() {
      const cols = ['Time', 'Call', 'Destination', 'Gateway'];

      const headRow = document.createElement('tr');
      for (const c of cols) {
        const th = document.createElement('th');
        th.textContent = c.toUpperCase();
        headRow.appendChild(th);
      }
      const thead = document.createElement('thead');
      thead.appendChild(headRow);

      const tbody = document.createElement('tbody');
      for (const entry of activity) {
        tbody.appendChild(makeRow(entry, cols, 'Call'));
      }
      $('recent').replaceChildren(thead, tbody);
    }

    // Populate from server on page load
    if (SERVER_ACTIVITY && SERVER_ACTIVITY.length) {
      for (const raw of SERVER_ACTIVITY) {
        activity.push({
          Time: raw.time,
          Call: raw.call,
          Destination: raw.dest,
          Gateway: raw.gw,
        });
      }
      activity.length = Math.min(activity.length, MAX_ACTIVITY);

      // Render the seeded activity
      renderActivityTable();
      $('activity').hidden = false;
    }

    function addActivity(data) {
      const call = data.call.toUpperCase();
      const idx = activity.findIndex(a => a.Call.toUpperCase() === call);
      if (idx !== -1) activity.splice(idx, 1);

      activity.unshift({
        Time: data.time,
        Call: data.call,
        Destination: data.dest,
        Gateway: data.gw,
      });
      activity.length = Math.min(activity.length, MAX_ACTIVITY);
      renderActivityTable();
      $('activity').hidden = false;
    }

    function renderTx({ data }) {
      if (data === null) {
        clearTx();
        return;
      }
      // The server sends a "tx" message for every received-data line;
      // only react when the transmitting station changes.
      if (data.call === currentCall) return;

      currentCall = data.call;
      addActivity(data);
      callsignEl.textContent = data.call;
      timer.reset();
      timer.start();
    }

    function clearTx() {
      currentCall = '';
      callsignEl.textContent = '';
      timer.reset();
    }

    function setStatus(on) {
      const statusEl = $('status');
      statusEl.textContent = on ? 'connected' : 'disconnected';
      statusEl.className = on ? 'on' : 'off';
    }

    function metaUpdate(payload) {
      if (!payload.timestamp)
        return;
      const update_time = new Date(payload.timestamp).toLocaleTimeString();
      const cnx = connected.length;
      $('meta').textContent = `${cnx} Reflector(s) connected — Updated: ${update_time}`;
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/connections`);

      ws.onopen = () => setStatus(true);

      ws.onmessage = (ev) => {
        if (!ev.data) return;                 // server keep-alive
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (msg.type === 'connected') {
          renderConnected(msg);
        } else if (msg.type === 'tx') {
          renderTx(msg);
        } else if (msg.type === 'rm') {
          removeConnected(msg);
        } else if (msg.type === 'add') {
          addConnected(msg);
        }
        metaUpdate(msg);
      };

      ws.onclose = () => {
        setStatus(false);
        clearTx();
        ws = null;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_MS);
      };

      ws.onerror = () => ws?.close();
    }

    connect();
  </script>
</body>
</html>
