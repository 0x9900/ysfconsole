<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ reflector_name }} YSF Reflector</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/ysfconsole.css">
</head>
<body>
  <header>
    <h1>Live Reflector — <code>{{ reflector_name }}</code></h1>
    <span id="status" class="off">disconnected</span>
  </header>
  <main>
    <div class="tx">
      <div class="callsign" id="callsign"></div>
      <div class="destination" id="target"></div>
      <div class="gateway" id="gateway"></div>
      <div class="timer" id="timer"></div>
    </div>
    <div id="info"></div>
    <div id="connected" hidden>
      <div class="marker">Linked repeaters/gateways:</div>
      <div id="meta"></div>
      <table id="linked" class="payload-table"></table>
    </div>

    <div id="activity" hidden>
      <div class="marker">Recent activity:</div>
      <table id="recent" class="payload-table"></table>
    </div>
  </main>

  <footer>
    ysfconsole ({{ version }}) &copy; 2026 <a href="https://www.qrz.com/db/W6BSD/" target="bsd">W6BSD</a><br>
    Visit <a href="https://bsdworld.org/" target="bsd">bsdworld.org</a> for more solar
    activty information. <br>
    HamRadio <a href="https://tools.bsdworld.org/" target="bsd">Tools</a>
    &mdash; Maidenhead Grid Square <a href="https://tools.bsdworld.org/QRA-Locator/" target="bsd">QRA-Locator</a>
  </footer>

  <script>
    'use strict';

    const RECONNECT_MS = {{ reconnect_ms }};
    const MAX_ACTIVITY = {{ max_activity }};
    const SERVER_ACTIVITY = {{ last_traffic|tojson }};

    let connected = [];
    let activity = [];

    const $ = (id) => document.getElementById(id);
    const connectedEl = $('connected');
    const tableEl     = $('linked');
    const statusEl    = $('status');
    const metaEl      = $('meta');
    const callsignEl  = $('callsign');
    const targetEl    = $('target');
    const gatewayEl   = $('gateway');
    const activityEl  = $('activity');
    const recentEl    = $('recent');
    const infoEl      = $('info');

    class Timer {
      constructor(elementId = 'timer', maxDurationMs = 3 * 60 * 1000) {
        this.element = $(elementId);
        this.intervalId = null;
        this.startTime = 0;
        this.elapsed = 0;
        this.maxDurationMs = maxDurationMs;
      }

      static format(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${minutes}:${seconds}`;
      }

      start() {
        if (this.intervalId !== null) return;
        this.startTime = Date.now() - this.elapsed;
        this.render();
        this.intervalId = setInterval(() => this.tick(), 1000);
      }

      tick() {
        this.elapsed = Math.min(Date.now() - this.startTime, this.maxDurationMs);
        this.render();
        if (this.elapsed >= this.maxDurationMs) this.stop();
      }

      stop() {
        if (this.intervalId === null) return;
        clearInterval(this.intervalId);
        this.intervalId = null;
        this.render();
      }

      reset() {
        this.stop();
        this.elapsed = 0;
        this.element.textContent = '';
      }

      render() {
        this.element.textContent = Timer.format(this.elapsed);
      }
    }

    const timer = new Timer();
    let currentCall = '';
    let ws = null;
    let reconnectTimer = null;

    function makeRow(entry, cols, linkColumn) {
      const tr = document.createElement('tr');
      for (const col of cols) {
        const td = document.createElement('td');
        const value = entry[col] ?? '';

        if (col.toLowerCase() === 'time' && value) {
          td.textContent = new Date(value).toLocaleString();
        } else if (col === linkColumn && value) {
          const a = document.createElement('a');
          a.href = `https://qrz.com/db/${value}`;
          a.textContent = value;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          td.appendChild(a);
        } else {
          td.textContent = value;
        }
        tr.appendChild(td);
      }
      return tr;
    }

    function renderConnectedTable() {
      // Columns = union of keys, in order of first appearance.
      const cols = [...new Set(connected.flatMap(Object.keys))];

      const headRow = document.createElement('tr');
      for (const c of cols) {
        const th = document.createElement('th');
        th.textContent = c.toUpperCase();
        headRow.appendChild(th);
      }
      const thead = document.createElement('thead');
      thead.appendChild(headRow);

      const tbody = document.createElement('tbody');
      for (const obj of connected) {
        tbody.appendChild(makeRow(obj, cols, 'call'));
      }

      tableEl.replaceChildren(thead, tbody);

      metaEl.textContent =
        `${connected.length} Reflector(s) connected — Updated: ${new Date().toLocaleTimeString()}`;
      connectedEl.scrollTop = 0;
      connectedEl.hidden = false;
    }

    const sameEntry = (a, b) => a.call === b.call && a.ip_address === b.ip_address && a.port === b.port;

    function addConnected({ data }) {
      if (!connected.some(item => sameEntry(item, data))) {
        connected.push(data);
      }
      renderConnectedTable();
      infoEl.textContent = `${data.call} Connected`;
    }

    function removeConnected({ data }) {
      connected = connected.filter(item => !sameEntry(item, data));
      renderConnectedTable();
      infoEl.textContent = `${data.call} Disconnected`;
    }

    function renderConnected({ data }) {
      const lines = data.filter(Boolean);
      connected = [...lines];
      renderConnectedTable();
      infoEl.textContent = "";
    }

    function clearTx() {
      currentCall = '';
      callsignEl.textContent = '';
      targetEl.textContent = '';
      gatewayEl.textContent = '';
      timer.reset();
    }

    function renderActivityTable() {
      const cols = ['Time', 'Call', 'Destination', 'Gateway'];

      const headRow = document.createElement('tr');
      for (const c of cols) {
        const th = document.createElement('th');
        th.textContent = c.toUpperCase();
        headRow.appendChild(th);
      }
      const thead = document.createElement('thead');
      thead.appendChild(headRow);

      const tbody = document.createElement('tbody');
      for (const entry of activity) {
        tbody.appendChild(makeRow(entry, cols, 'Call'));
      }
      recentEl.replaceChildren(thead, tbody);
    }

    // Populate from server on page load
    if (SERVER_ACTIVITY && SERVER_ACTIVITY.length) {
      for (const raw of SERVER_ACTIVITY) {
        activity.push({
          Time: raw.time,
          Call: raw.call,
          Destination: raw.dest,
          Gateway: raw.gw,
        });
      }
      activity.length = Math.min(activity.length, MAX_ACTIVITY);

      // Render the seeded activity
      renderActivityTable();
      activityEl.hidden = false;
    }

    function addActivity(data) {
      activity.unshift({
        Time: data.time,          // keep ISO for sorting
        Call: data.call,
        Destination: data.dest,
        Gateway: data.gw,
      });
      activity.length = Math.min(activity.length, MAX_ACTIVITY);
      renderActivityTable();
      activityEl.hidden = false;
    }

    function renderTx({ data }) {
      if (data === null) {
        clearTx();
        return;
      }
      // The server sends a "tx" message for every received-data line;
      // only react when the transmitting station changes.
      if (data.call === currentCall) return;

      currentCall = data.call;
      addActivity(data);
      callsignEl.textContent = data.call;
      targetEl.textContent = data.dest;
      gatewayEl.textContent = data.gw;
      timer.reset();
      timer.start();
    }

    function setStatus(on) {
      statusEl.textContent = on ? 'connected' : 'disconnected';
      statusEl.className = on ? 'on' : 'off';
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/connections`);

      ws.onopen = () => setStatus(true);

      ws.onmessage = (ev) => {
        if (!ev.data) return;                 // server keep-alive
        let msg;
        try {
          msg = JSON.parse(ev.data);
        } catch {
          return;
        }
        if (msg.type === 'connected') {
          renderConnected(msg);
        } else if (msg.type === 'tx') {
          renderTx(msg);
        } else if (msg.type === 'rm') {
          removeConnected(msg);
        } else if (msg.type === 'add') {
          addConnected(msg);
        }
      };

      ws.onclose = () => {
        setStatus(false);
        clearTx();                            // don't show a stale transmission
        ws = null;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_MS);
      };

      ws.onerror = () => ws?.close();
    }

    connect();
  </script>
</body>
</html>
