<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ reflector_name }} YSF Reflector</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kode+Mono:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/ysfconsole.css">
</head>
<body>
  <header>
    <h1>Live Reflector — <code>{{ reflector_name }}</code></h1>
    <span id="status" class="off">disconnected</span>
  </header>
  <main>
    <div class="tx">
      <div class="callsign" id="callsign"></div>
      <div class="destination" id="target"></div>
      <div class="gateway" id="gateway"></div>
      <div class="timer" id="timer"></div>
    </div>

    <div id="connected">
      <div class="marker">linked repeaters/gateways:</div>
      <table id="linked" class="payload-table"></table>
    </div>
    <div id="meta"></div>

    <div id="activity" hidden>
      <div class="marker">Recent activity:</div>
      <table id="recent" class="payload-table"></table>
    </div>
  </main>

  <footer>
    &copy; 2026 <a href="https://www.qrz.com/db/W6BSD/" target="bsd">W6BSD</a> &mdash;
    Visit <a href="https://bsdworld.org/" target="bsd">bsdworld.org</a> for more solar
    activty information. &mdash; HamRadio <a href="https://tools.bsdworld.org/" target="bsd">Tools</a>
    &mdash; Maidenhead Grid Square <a href="https://tools.bsdworld.org/QRA-Locator/" target="bsd">QRA-Locator</a>
  </footer>

  <script>
    'use strict';

    const RECONNECT_MS = {{ reconnect_ms }};
    const MAX_ACTIVITY = {{ max_activity }};

    const $ = (id) => document.getElementById(id);
    const connectedEl = $('connected');
    const tableEl     = $('linked');
    const statusEl    = $('status');
    const metaEl      = $('meta');
    const callsignEl  = $('callsign');
    const targetEl    = $('target');
    const gatewayEl   = $('gateway');
    const activityEl  = $('activity');
    const recentEl    = $('recent');

    class Timer {
      constructor(elementId = 'timer', maxDurationMs = 3 * 60 * 1000) {
        this.element = $(elementId);
        this.intervalId = null;
        this.startTime = 0;
        this.elapsed = 0;
        this.maxDurationMs = maxDurationMs;
      }

      static format(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${minutes}:${seconds}`;
      }

      start() {
        if (this.intervalId !== null) return;
        this.startTime = Date.now() - this.elapsed;
        this.render();
        this.intervalId = setInterval(() => this.tick(), 1000);
      }

      tick() {
        this.elapsed = Math.min(Date.now() - this.startTime, this.maxDurationMs);
        this.render();
        if (this.elapsed >= this.maxDurationMs) this.stop();
      }

      stop() {
        if (this.intervalId === null) return;
        clearInterval(this.intervalId);
        this.intervalId = null;
        this.render();
      }

      reset() {
        this.stop();
        this.elapsed = 0;
        this.element.textContent = '';
      }

      render() {
        this.element.textContent = Timer.format(this.elapsed);
      }
    }

    const timer = new Timer();
    let currentCall = '';
    let ws = null;
    let reconnectTimer = null;

    function renderConnected(payload) {
      const lines = payload.lines.filter(Boolean);

      // Columns = union of keys, in order of first appearance.
      const cols = [...new Set(lines.flatMap(Object.keys))];

      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      for (const c of cols) {
        const th = document.createElement('th');
        th.textContent = c.toUpperCase();
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);

      const tbody = document.createElement('tbody');
      for (const obj of lines) {
        const tr = document.createElement('tr');
        for (const c of cols) {
          const td = document.createElement('td');
          td.textContent = obj[c] ?? '';
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }

      tableEl.replaceChildren(thead, tbody);

      metaEl.textContent =
        `${lines.length} Reflector(s) connected — Updated: ${new Date().toLocaleTimeString()}`;
      connectedEl.scrollTop = 0;
    }

    function clearTx() {
      currentCall = '';
      callsignEl.textContent = '';
      targetEl.textContent = '';
      gatewayEl.textContent = '';
      timer.reset();
    }

    const activity = [];                      // newest first

    function addActivity(tx) {
      activity.unshift({
        Time: new Date().toLocaleTimeString(),
        Call: tx.call,
        Destination: tx.dest,
        Gateway: tx.gw,
      });
      activity.length = Math.min(activity.length, MAX_ACTIVITY);

      const cols = ['Time', 'Call', 'Destination', 'Gateway'];

      const headRow = document.createElement('tr');
      for (const c of cols) {
        const th = document.createElement('th');
        th.textContent = c.toUpperCase();
        headRow.appendChild(th);
      }
      const thead = document.createElement('thead');
      thead.appendChild(headRow);

      const tbody = document.createElement('tbody');
      for (const entry of activity) {
        const tr = document.createElement('tr');
        for (const c of cols) {
          const td = document.createElement('td');
          td.textContent = entry[c] ?? '';
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }

      recentEl.replaceChildren(thead, tbody);
      activityEl.hidden = false;
    }

    function renderTx({ tx }) {
      if (tx === null) {
        clearTx();
        return;
      }
      // The server sends a "tx" message for every received-data line;
      // only react when the transmitting station changes.
      if (tx.call === currentCall) return;

      currentCall = tx.call;
      addActivity(tx);
      callsignEl.textContent = tx.call;
      targetEl.textContent = tx.dest;
      gatewayEl.textContent = tx.gw;
      timer.reset();
      timer.start();
    }

    function setStatus(on) {
      statusEl.textContent = on ? 'connected' : 'disconnected';
      statusEl.className = on ? 'on' : 'off';
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/connections`);

      ws.onopen = () => setStatus(true);

      ws.onmessage = (ev) => {
        if (!ev.data) return;                 // server keep-alive
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === 'connected') renderConnected(msg);
        else if (msg.type === 'tx') renderTx(msg);
      };

      ws.onclose = () => {
        setStatus(false);
        clearTx();                            // don't show a stale transmission
        ws = null;
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_MS);
      };

      ws.onerror = () => ws?.close();
    }

    connect();
  </script>
</body>
</html>
