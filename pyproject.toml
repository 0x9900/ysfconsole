[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ysfconsole"
dynamic = ["version"]
description = "Monitor the connections on a YSF reflector"
readme = "README.md"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
  { name = "Fred C" },
]
keywords = ["flask", "websocket"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Logging",
]

dependencies = [
  "Flask>=3.0",
  "flask-sock>=0.7",
]

[project.optional-dependencies]
dev = [
  "build",
  "pre-commit",
  "flake8",
  "isort",
  "pylint",
  "ipython",
  "ipdb",
]

[tool.setuptools.dynamic]
version = {attr = "ysfconsole.__version__"}

[project.scripts]
ysfrun = "ysfconsole.run:main"

[project.urls]
Homepage = "https://github.com/0x9900/ysfconsole"
Issues   = "https://github.com/0x9900/ysfconsole/issues"

[tool.setuptools.packages.find]
include = ["ysfconsole*"]

[tool.setuptools.package-data]
ysfconsole = [
  "templates/*",
  "static/*",
  "static/**/*",
]

[tool.mypy]
disable_error_code = [
  "import-untyped",
  "annotation-unchecked",
]

[tool.ty.environment]
python-version = "3.14"
